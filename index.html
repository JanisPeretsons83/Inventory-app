<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Inventarizācija</title>

  <!-- ✅ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">

  <!-- ✅ iPhone + Android full screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- ✅ iPhone ikona -->
  <link rel="apple-touch-icon" href="icons/worklog-192.png">

  <link rel="stylesheet" href="style.css">
</head>


<body>
  <!-- Login -->
<div id="locationSelect">
  <h3>Izvēlies ražotni</h3>
  
<button onclick="setLocation('Cecīļu', this)">Cecīļu ražotne</button>
<button onclick="setLocation('Dārdu', this)">Dārdu ražotne</button>
  
<input id="userNameInput" placeholder="Vārds Uzvārds">

<button onclick="saveUser()">Turpināt</button>

</div>
<div id="appContent" style="display:none">
<h2>Inventarizācija</h2>
  <div id="infoLine" class="info"></div>
  
<!-- Apgabals -->

<div id="mapsContainer" class="areaRow">

  <select id="area">
    <option value="">Apgabals *</option>
  </select>

  <div id="mapLinks"></div>

</div>


<input id="packages" type="number" placeholder="Paku skaits *">

<!-- Izmēri -->
<div class="row">
  <input id="thickness" type="number" placeholder="Biezums(mm) *">
  <input id="width" type="number" placeholder="Platums(mm) *">
  <input id="length" placeholder="Garums (mm)/ gali">
</div>

<!-- GALI (pakas izmēri) -->
<div id="galiInputs" class="row" style="display:none">
  <input id="packWidth" type="number" placeholder="Pakas platums(mm)">
  <input id="packLength" type="number" placeholder="Pakas garums(mm)">
  <input id="packHeight" type="number" placeholder="Pakas augstums(mm)">
  <input id="avgLength" type="number" placeholder="Vidējais detaļas garums(mm)">
</div>

<!-- Gabali -->
  <div class="piecesRow">
    <input id="pieces" type="number" placeholder="Gabali pakā">
      <div id="calcInfo" style="font-size:12px; color:gray; margin-top:5px;">
        * Aprēķini veikti ar 95% aizpildījuma efektivitāti
      </div>
  </div>
  <!-- Pakas + datums -->
<div class="row">
  <input id="month" type="number" placeholder="Mēnesis *">
  <input id="year" type="number" placeholder="Gads *">
</div>

  <!-- Nosaukums + kods -->
<div class="row">
  <input id="name" placeholder="Detaļas nosaukums">
  <input id="productCode" placeholder="Produkta kods">
</div>

<!-- Šķira -->
<select id="grade">
    <option value="">-- Izvēlies šķiru --</option>
  <optgroup label="K-kods">
    <option value="K">Sakomplektēta produkcija (K)</option>
  </optgroup>
  
  <optgroup label="Augstākā šķira">
    <option value="A">Pilnībā gatava detaļas, pabeigtas visas operācijjas, t.sk., impregnācija (A)</option>
  </optgroup>
  
  <optgroup label="1. šķira">
    <option value="1a">Ēvelēti dēļi (1a)</option>
    <option value="1b">Neēvelēti, bet sagarināti dēļi (1b)</option>
    <option value="1c">Ēvelētas sagarinātas sagataves (1c)</option>
    <option value="1d">Tālākā apstrādē esošas sagataves (1d)</option>
  </optgroup>
  
  <optgroup label="2. šķira">
    <option value="2a">Sagataves, detaļas un gali, kurām pagaidām nav konkrēta pielietojuma  (2a)</option>
    <option value="2b">Brāķis, kuram redzam pielietojumu - varam izmantot tālākā apstrādē (2b)</option>
    <option value="2c">Brāķis, kuram nav pielietojums - iznīcināms (2c)</option>
  </optgroup>
  
  <optgroup label="Paletes">
    <option value="PAL">Paletes gatavai produkcijai (PAL)</option>
  </optgroup>
  
</select>

<!-- Komentārs -->
<input id="comment" placeholder="Komentārs">

<!-- Pogas -->
<button class="primary" onclick="add()">➕ Pievienot</button>

<button class="secondary" onclick="toggleTable()">
📋 Skatīt / Slēpt
</button>

<button class="primary" onclick="exportExcel()">
📤 Saglabāt Excel
</button>

<button onclick="endSession()" class="danger">
  🛑 Beigt darbu
</button>

<div id="error"></div>

<table id="table"></table>
</div>
  <div id="imageModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  z-index:9999;">
  
  <img id="modalImg"
       style="display:block;
              margin:auto;
              max-width:95%;
              max-height:95%;
              margin-top:20px;">
</div>
<script src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
</body>
</html>
